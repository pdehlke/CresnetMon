[project]
name = "cresnetmon"
version = "0.1.0"
description = "Crestron Cresnet RS-485 bus monitor (macOS port)"
requires-python = ">=3.14"
dependencies = [
    "pyserial>=3.5",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cresnetmon"]

[dependency-groups]
dev = [
    "ruff>=0.15",
    "pytest>=9",
]
packaging = [
    "pyinstaller>=6.11",
]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["."]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
