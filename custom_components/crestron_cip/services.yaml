turn_on:
  name: Turn on a Crestron load
  description: >-
    Turn a lighting load on. The Crestron buttons are toggles, so this presses
    only when the load's live feedback says it is currently off, then waits for
    the processor to confirm. Calling it on a load that is already on does
    nothing.
  fields:
    load:
      name: Load
      description: The load key, for example office_pool_bath.
      required: true
      example: office_pool_bath
      selector:
        text:

turn_off:
  name: Turn off a Crestron load
  description: >-
    Turn a lighting load off, with the same press-only-if-needed behaviour as
    turn_on.
  fields:
    load:
      name: Load
      description: The load key, for example office_pool_bath.
      required: true
      example: office_pool_bath
      selector:
        text:

toggle:
  name: Toggle a Crestron load
  description: >-
    Flip a lighting load. Refuses rather than pressing blind if the load's
    current state is not known.
  fields:
    load:
      name: Load
      description: The load key, for example office_pool_bath.
      required: true
      example: office_pool_bath
      selector:
        text:

enter_subsystem:
  name: Enter a Crestron subsystem
  description: >-
    Switch one panel slot between the Lights and A/V subsystems. The AADS reuses
    join numbers across subsystems, so a slot holds exactly one at a time and the
    bridge refuses to write a lighting join while the slot is in A/V. Returns the
    subsystem the slot ended up in. Switching away freezes lighting feedback until
    the slot returns, which it does on its own once idle.
  fields:
    link:
      name: Link
      description: Which processor link to switch. Only the AADS has subsystems.
      required: false
      default: aads
      example: aads
      selector:
        select:
          options:
            - aads
            - mc2e
    subsystem:
      name: Subsystem
      description: Which subsystem to enter.
      required: true
      example: av
      selector:
        select:
          options:
            - lights
            - av
    hold_seconds:
      name: Hold
      description: >-
        Defer the automatic return to Lights by this many seconds, so the
        excursion lasts long enough to observe. Leave at zero in normal use.
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 300
          unit_of_measurement: s
  response:
    optional: true


av_status:
  name: Read an audio zone
  description: >-
    Report one zone's source, volume and mute state. The AADS exposes one zone
    at a time through a per-slot cursor, so this moves the cursor onto the zone
    first. That does not disturb the physical panels, which carry cursors of
    their own.
  fields:
    zone:
      name: Zone
      description: Which audio zone to act on.
      required: true
      example: studio
      selector:
        select:
          options:
            - kitchen
            - outdoor_kitchen
            - master_bed
            - master_bath
            - studio
            - courtyard
  response:
    optional: true

av_select_source:
  name: Select a source in an audio zone
  description: >-
    Select a source, which also powers the zone on: source select and power on
    are one action on this system, and only power off is separate. The zone's
    volume is replaced by the AADS's preset for that source, so set the volume
    after this and never before.
  fields:
    zone:
      name: Zone
      description: Which audio zone to act on.
      required: true
      example: studio
      selector:
        select:
          options:
            - kitchen
            - outdoor_kitchen
            - master_bed
            - master_bath
            - studio
            - courtyard
    source:
      name: Source
      description: >-
        Source number, 1 to 6. Source identity beyond AirPlay is unresolved: the
        AADS and Integra wiring was customised and the Integra's input labels do
        not match what they select.
      required: true
      example: 2
      selector:
        number:
          min: 1
          max: 6
  response:
    optional: true

av_set_volume:
  name: Set an audio zone's volume
  description: >-
    Ramp a zone to a percentage of full scale and converge on it. The volume
    join accepts no direct write, so this holds the up or down button for a
    computed time and corrects against what the processor then reports, giving
    the slot back between segments so lighting commands are not held up. The
    speakers are inaudible below roughly 80 percent, so the useful span is the
    top fifth.
  fields:
    zone:
      name: Zone
      description: Which audio zone to act on.
      required: true
      example: studio
      selector:
        select:
          options:
            - kitchen
            - outdoor_kitchen
            - master_bed
            - master_bath
            - studio
            - courtyard
    volume:
      name: Volume
      description: Target level as a percentage of full scale.
      required: true
      example: 90
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
  response:
    optional: true

av_power_off:
  name: Power off an audio zone
  description: >-
    Power one zone off. This clears the zone's remembered source rather than
    only silencing it, and there is no join path back to "off with a source
    remembered", because restoring the source powers the zone on again.
  fields:
    zone:
      name: Zone
      description: Which audio zone to act on.
      required: true
      example: studio
      selector:
        select:
          options:
            - kitchen
            - outdoor_kitchen
            - master_bed
            - master_bath
            - studio
            - courtyard
  response:
    optional: true

av_power_off_all:
  name: Power off every audio zone
  description: >-
    Power all six zones off with a single press. Returns nothing, because only
    the cursor's zone is readable and every zone's state just changed.

av_mute:
  name: Mute or unmute an audio zone
  description: >-
    Set a zone's mute state. The mute button is a toggle, so this consults the
    live feedback first and presses only when it differs.
  fields:
    zone:
      name: Zone
      description: Which audio zone to act on.
      required: true
      example: studio
      selector:
        select:
          options:
            - kitchen
            - outdoor_kitchen
            - master_bed
            - master_bath
            - studio
            - courtyard
    mute:
      name: Mute
      description: True to mute, false to unmute.
      required: true
      example: true
      selector:
        boolean:
  response:
    optional: true
